name: mybrev_flutter
description: "Малітоўнік — беларускі каталіцкі малітвоўнік"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  archive: ^4.0.7
  firebase_core: ^3.12.1
  cloud_firestore: ^5.6.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  flutter_html: ^3.0.0-beta.2
  html: ^0.15.6
  intl: ^0.20.2
  wakelock_plus: ^1.3.4
  google_fonts: ^6.2.1
  phosphor_flutter: ^2.1.0
  connectivity_plus: ^6.1.4
  share_plus: ^10.1.4
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.2

dependency_overrides:
  # objective_c >=6.0.0 uses Dart native assets which fail to bundle on this
  # Xcode/simulator setup → pin path_provider_foundation to a version that
  # still uses objective_c ^4.x (no native assets required).
  path_provider_foundation: 2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/mary.png
    - assets/bible_seed_bel.json.gz
    - assets/bible_seed_ru.json.gz
