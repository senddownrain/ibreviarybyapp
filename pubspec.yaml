name: mybrev_flutter
description: "Малітоўнік — беларускі каталіцкі малітвоўнік"
publish_to: 'none'
version: 1.0.0+6

environment:
  sdk: ^3.11.1
  flutter: ">=3.41.4 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  archive: ^4.0.7
  crypto: ^3.0.6
  flutter_secure_storage: 9.2.4
  firebase_core: ^3.12.1
  firebase_app_check: 0.3.2+10
  firebase_app_check_platform_interface: 0.1.1+10
  firebase_auth: 5.7.0
  cloud_firestore_platform_interface: 6.6.12
  cloud_firestore: ^5.6.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  flutter_html: ^3.0.0-beta.2
  # flutter_html 3.0.0 calls html's query_selector.matches API, removed in
  # html 0.15.7. Keep the direct parser dependency at the compatible release.
  html: 0.15.6
  intl: ^0.20.2
  wakelock_plus: ^1.3.4
  google_fonts: ^6.2.1
  phosphor_flutter: ^2.1.0
  flutter_svg: ^2.2.1
  connectivity_plus: ^6.1.4
  share_plus: ^10.1.4
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.2
  scrollable_positioned_list: ^0.3.8
  markdown: 7.3.1
  http: ^1.6.0
  in_app_review: ^2.0.12

dependency_overrides:
  # objective_c >=6.0.0 uses Dart native assets which fail to bundle on this
  # Xcode/simulator setup → pin path_provider_foundation to a version that
  # still uses objective_c ^4.x (no native assets required).
  path_provider_foundation: 2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    # The approved app icon without its background (from brand_splash_icon).
    - assets/brand_mark.png
    - assets/mary.png
    - assets/bible_seed_bel.json.gz
    - assets/bible_seed_ru.json.gz
    - assets/mass/order-of-mass-en.md
    - assets/mass/order-of-mass.ritual.json
    # Canonical content shipped with the app (MyBrev `npm run content:app-bundle`).
    - assets/content/
    - assets/category_icons/
    - assets/compendium/compendium_search_aliases.json
    - assets/legal/sources.json
    # Belarusian hyphenation patterns (hyph-utf8 `hyph-be`, MIT, M. Salau).
    - assets/hyphenation/hyph-be.tex
    # Book faces used by ReaderTheme, bundled so the first launch without a
    # network has the right typography (google_fonts reads these first).
    - assets/google_fonts/
