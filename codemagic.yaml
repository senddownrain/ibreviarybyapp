# Codemagic CI/CD configuration for iBreviaryBy.
# Docs: https://docs.codemagic.io/yaml/yaml-getting-started/
#
# Workflows:
#   ios-simulator  — debug build for the iOS Simulator, no codesigning needed.
#   android-debug  — debug APK build.

workflows:
  ios-simulator:
    name: iOS Simulator
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      # Flutter version must satisfy pubspec `sdk: ^3.10.8` (Dart).
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Resolve Flutter dependencies
        script: flutter pub get
      - name: Install iOS dependencies
        script: |
          cd ios
          pod install
      - name: Run Flutter tests
        script: flutter test
      - name: Build for iOS Simulator
        script: flutter build ios --simulator --debug
    publishing:
      email:
        recipients:
          - gleb2000405@outlook.com
        notify:
          success: true
          failure: true
    artifacts:
      - build/ios/iphonesimulator/*.app
      - flutter_drive.log

  android-debug:
    name: Android Debug APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Resolve Flutter dependencies
        script: flutter pub get
      - name: Build debug APK
        script: flutter build apk --debug
    publishing:
      email:
        recipients:
          - gleb2000405@outlook.com
        notify:
          success: true
          failure: true
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
