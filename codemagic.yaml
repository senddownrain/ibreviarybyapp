# Codemagic CI/CD configuration for iBreviaryBy.
# Docs: https://docs.codemagic.io/yaml/yaml-getting-started/
#
# Workflows:
#   ios-simulator     — debug build for the iOS Simulator, no codesigning needed.
#   android-debug     — debug APK build.
#   ios-visual-audit  — iOS Simulator screenshots for the visual UX audit
#                       (branches `audit/*` only; never publishes the app).
#   ios-testflight    — signed App Store build of «MyBrev Test»
#                       (by.mybrev.testflight2026), uploaded to App Store
#                       Connect for TestFlight. Started manually only.
#                       Fallback: the main path is fastlane (docs/RELEASE_BETA.md).

workflows:
  ios-simulator:
    name: iOS Simulator
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      # Pinned to the version the app is developed against; newer Flutter
      # stable marks IconData final, which breaks phosphor_flutter 2.x.
      flutter: 3.38.9
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Resolve Flutter dependencies
        script: flutter pub get
      - name: Install iOS dependencies
        script: |
          cd ios
          pod install
      - name: Run Flutter tests
        script: flutter test
      - name: Build for iOS Simulator
        script: flutter build ios --simulator --debug
    publishing:
      email:
        recipients:
          - gleb2000405@outlook.com
        notify:
          success: true
          failure: true
    artifacts:
      - build/ios/iphonesimulator/*.app
      - flutter_drive.log

  android-debug:
    name: Android Debug APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.38.9
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Resolve Flutter dependencies
        script: flutter pub get
      - name: Build debug APK
        script: flutter build apk --debug
    publishing:
      email:
        recipients:
          - gleb2000405@outlook.com
        notify:
          success: true
          failure: true
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

  ios-visual-audit:
    name: iOS Visual Audit (Simulator)
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      flutter: 3.38.9
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: audit/*
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Resolve Flutter dependencies
        script: flutter pub get
      - name: Install iOS dependencies
        script: |
          cd ios
          pod install
      - name: Environment
        script: |
          flutter --version
          dart --version
          xcodebuild -version
          xcrun simctl list devicetypes
          xcrun simctl list runtimes
      - name: Build simulator app
        script: flutter build ios --simulator --debug
      - name: Visual audit on iOS Simulator
        script: |
          AUDIT_OUT=audit-evidence/ios-cloud ./scripts/ios_visual_audit.sh
      - name: Export audit evidence
        script: |
          mkdir -p "$CM_EXPORT_DIR"
          cd audit-evidence && zip -qr "$CM_EXPORT_DIR/ios-cloud-audit.zip" ios-cloud
    artifacts:
      - build/ios/iphonesimulator/*.app
      - audit-evidence/ios-cloud/**/*.png
      - audit-evidence/ios-cloud/*.txt
      - audit-evidence/ios-cloud/*.md
      - audit-evidence/ios-cloud/logs/*.log

  ios-testflight:
    name: iOS TestFlight (MyBrev Test)
    instance_type: mac_mini_m2
    max_build_duration: 90
    # Team integrations → App Store Connect (API key with App Manager role:
    # Issuer ID, Key ID, .p8). The name must match the integration exactly.
    integrations:
      app_store_connect: MyBrev App Store Connect
    environment:
      flutter: 3.38.9
      xcode: latest
      cocoapods: default
      ios_signing:
        # Codemagic fetches or creates the Apple Distribution certificate and
        # the App Store profile of this App ID.
        distribution_type: app_store
        bundle_identifier: by.mybrev.testflight2026
    # No triggering: a TestFlight upload is started by hand in Codemagic.
    scripts:
      - name: Resolve Flutter dependencies
        script: flutter pub get
      - name: Install iOS dependencies
        script: |
          cd ios
          pod install
      - name: Use the App Store profile
        script: xcode-project use-profiles
      - name: Analyze and test
        script: |
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Build signed IPA
        # Codemagic's BUILD_NUMBER grows with every build of this workflow;
        # +6 keeps it above the builds made before TestFlight (1.0.0+6).
        script: |
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$((BUILD_NUMBER + 6)) \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - gleb2000405@outlook.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        # Upload only: internal testers get the build after processing.
        # External groups and Beta App Review are chosen in App Store
        # Connect → TestFlight; the App Store version is never submitted.
        submit_to_testflight: false
