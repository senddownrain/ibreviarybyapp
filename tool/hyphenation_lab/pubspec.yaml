name: hyphenation_lab
description: Isolated Belarusian justified-text typography lab. No Firebase, no network.
publish_to: none
version: 0.0.1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_html: ^3.0.0-beta.2
  # Same pin as the main app (flutter_html 3.0.0 needs html <= 0.15.6).
  html: 0.15.6

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: false
  assets:
    - assets/patterns/hyph-be.tex
  fonts:
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-Regular.ttf
    - family: SourceSerif4
      fonts:
        - asset: assets/fonts/SourceSerif4-Regular.ttf
    - family: OldStandardTT
      fonts:
        - asset: assets/fonts/OldStandardTT-Regular.ttf
        - asset: assets/fonts/OldStandardTT-Italic.ttf
          style: italic
        - asset: assets/fonts/OldStandardTT-Bold.ttf
          weight: 700
    - family: Kurale
      fonts:
        - asset: assets/fonts/Kurale-Regular.ttf
