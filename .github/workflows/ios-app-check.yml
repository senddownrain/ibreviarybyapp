name: iOS dependency resolution

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ios-app-check.yml'
      - 'ios/**'
      - 'lib/services/firebase_app_check.dart'
      - 'pubspec.*'

permissions:
  contents: read

jobs:
  resolve-pods:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.4'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Resolve iOS pods
        working-directory: ios
        run: pod install
      - uses: actions/upload-artifact@v4
        with:
          name: ios-podfile-lock
          path: ios/Podfile.lock
