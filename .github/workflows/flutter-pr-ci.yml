name: Flutter PR checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'assets/legal/**'
      - 'assets/content/**'
      - 'scripts/refresh_common_bundle.mjs'
      - 'scripts/lib/psalmody_bundle.mjs'
      - 'docs/sources/web-import-lock.json'
      - 'scripts/check_web_source_import.py'
      - 'tool/source_documents_smoke.dart'
      - '.github/workflows/flutter-pr-ci.yml'

permissions:
  contents: read

jobs:
  gospel-antiphon-source:
    name: Shipped Sunday 32 antiphon evidence
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Read bundled Sunday 32 antiphons
        run: python3 scripts/diagnose_antiphon_20261108.py

  flutter-check:
    name: Flutter analyze and alternatives regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.4'
          cache: true
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check changed Dart formatting
        run: dart format --output=none --set-exit-if-changed lib/utils/liturgical_alternatives.dart test/liturgical_alternatives_test.dart test/liturgical_screen_smoke_test.dart
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Local rights and external Web documents
        run: |
          python3 scripts/check_web_source_import.py
          dart format --output=none --set-exit-if-changed lib/models/source_documents.dart lib/screens/source_documents_screen.dart test/source_documents_test.dart test/source_documents_widget_test.dart tool/source_documents_smoke.dart
          flutter test test/source_documents_test.dart test/source_documents_widget_test.dart test/bible_repository_test.dart test/source_footer_test.dart test/compendium_screens_test.dart test/router_architecture_test.dart test/stateful_shell_navigation_test.dart test/secondary_menu_test.dart test/privacy_policy_link_test.dart
      - name: Unit regression
        run: flutter test test/liturgical_alternatives_test.dart test/pastors_hymn_test.dart
      - name: Sunday 32 Benedictus visual fixture
        env:
          LITURGY_SMOKE_IMAGES: '1'
        run: >-
          flutter test test/liturgical_screen_smoke_test.dart
          --plain-name "08.11.2026 Benedictus Year A antiphon is sung twice"
      - name: Archive Sunday 32 screen captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benedictus-2026-11-08-pr
          path: build/liturgy_smoke/2026-11-08-benedictus-year-a-*.png
          if-no-files-found: warn

      - name: Immaculate Heart and Sunday I Vespers regression
        run: flutter test test/liturgical_vespers_test.dart test/hours_regression_test.dart
      - name: Offline content, atomic updates and calendar refresh regression
        run: flutter test test/content_offline_test.dart test/ordo_content_update_test.dart
      - name: Movable feast daytime prayer and delivery regression
        run: >-
          flutter test test/high_priest_daytime_test.dart
          test/high_priest_daytime_parity_test.dart test/high_priest_minimal_patch_test.dart
          test/liturgical_resolution_test.dart
      - name: Check devotional reader formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          lib/utils/devotional_office.dart lib/widgets/devotional_office_reader.dart
          lib/widgets/prayer_content.dart lib/screens/prayer_detail_screen.dart
          lib/dev/devotional_office_harness.dart tool/devotional_office_smoke.dart
          test/devotional_office_test.dart test/devotional_office_widget_test.dart
      - name: Devotional offices and reader regression
        run: >-
          flutter test test/devotional_office_test.dart test/devotional_office_widget_test.dart
          test/prayer_formatting_widget_test.dart test/prayer_markdown_test.dart test/mass_reader_test.dart

      - name: Psalmody bundle, alternatives and existing local data
        run: |
          dart format --output=show --set-exit-if-changed test/doxology_bundle_test.dart test/common_office_test.dart
          flutter test test/doxology_bundle_test.dart test/common_office_test.dart test/content_offline_test.dart test/ordo_content_update_test.dart test/psalmody_html_modes_test.dart test/psalm_choir_html_test.dart

  analytics-tests:
    name: Analytics tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.4'
          cache: true
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analytics unit and widget tests
        run: flutter test test/analytics
      - name: Analytics enabled fit and recording tests
        run: flutter test --dart-define=ANALYTICS_LOCAL=true test/analytics
