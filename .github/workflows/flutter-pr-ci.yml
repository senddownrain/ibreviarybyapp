name: Flutter PR checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/flutter-pr-ci.yml'

permissions:
  contents: read

jobs:
  flutter-check:
    name: Flutter analyze and alternatives regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.4'
          cache: true
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check changed Dart formatting
        run: dart format --output=none --set-exit-if-changed lib/utils/liturgical_alternatives.dart test/liturgical_alternatives_test.dart
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Unit regression
        run: flutter test test/liturgical_alternatives_test.dart test/pastors_hymn_test.dart
      - name: Immaculate Heart and Sunday I Vespers regression
        run: flutter test test/liturgical_vespers_test.dart test/hours_regression_test.dart
      - name: Check devotional reader formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          lib/utils/devotional_office.dart lib/widgets/devotional_office_reader.dart
          lib/widgets/prayer_content.dart lib/screens/prayer_detail_screen.dart
          lib/dev/devotional_office_harness.dart tool/devotional_office_smoke.dart
          test/devotional_office_test.dart test/devotional_office_widget_test.dart
      - name: Devotional offices and reader regression
        run: >-
          flutter test test/devotional_office_test.dart test/devotional_office_widget_test.dart
          test/prayer_formatting_widget_test.dart test/prayer_markdown_test.dart test/mass_reader_test.dart

  analytics-tests:
    name: Analytics tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.4'
          cache: true
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analytics unit and widget tests
        run: flutter test test/analytics
      - name: Analytics enabled fit and recording tests
        run: flutter test --dart-define=ANALYTICS_LOCAL=true test/analytics
