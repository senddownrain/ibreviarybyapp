# MyBrev Android Beta Release — manual only.
# iOS is built and uploaded locally on the developer Mac.
# Android uses GitHub-hosted Ubuntu and never targets production.
name: MyBrev Android Beta Release

on:
  workflow_dispatch:
    inputs:
      android_track:
        description: Google Play testing track (never production)
        type: choice
        options: [internal, beta]
        default: beta
      release_notes:
        description: What testers should check (optional)
        type: string
        required: false
      allow_non_main:
        description: Release from a branch other than main
        type: boolean
        default: false
      run_full_tests:
        description: Run all tests instead of quick release subset
        type: boolean
        default: false

permissions:
  contents: read

env:
  LC_ALL: en_US.UTF-8
  LANG: en_US.UTF-8

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      flutter_version: ${{ steps.flutter.outputs.version }}
      app_version: ${{ steps.pubspec.outputs.version }}
      app_build: ${{ steps.pubspec.outputs.build }}
      reason: ${{ steps.ref.outputs.reason || steps.flutter.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ref is a fresh tip, tree is clean, track is allowed
        id: ref
        env:
          ALLOW_NON_MAIN: ${{ inputs.allow_non_main }}
          ANDROID_TRACK: ${{ inputs.android_track }}
        run: tool/release/check_ref.sh
      - name: Flutter version (pubspec.yaml is the source of truth)
        id: flutter
        run: |
          if ! version=$(tool/release/flutter_version.sh); then
            echo "reason=flutter_mismatch" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Flutter $version (pubspec.yaml environment.flutter)"
      - name: Version from pubspec.yaml
        id: pubspec
        run: |
          line=$(sed -nE 's/^version:[[:space:]]*([^[:space:]]+).*/\1/p' pubspec.yaml)
          echo "version=${line%%+*}" >> "$GITHUB_OUTPUT"
          echo "build=${line#*+}" >> "$GITHUB_OUTPUT"
          echo "Commit $GITHUB_SHA, pubspec version $line"

  quality:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      reason: ${{ steps.analyze.outputs.reason || steps.tests.outputs.reason || steps.pub.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ needs.prepare.outputs.flutter_version }}
          cache: true
      - name: Installed Flutter equals the pubspec requirement
        run: |
          installed=$(flutter --version --machine | sed -nE 's/.*"frameworkVersion": *"([^"]+)".*/\1/p')
          EXPECT_FLUTTER="$installed" tool/release/flutter_version.sh >/dev/null
          echo "Flutter $installed"
      - name: flutter pub get
        id: pub
        run: flutter pub get --enforce-lockfile || { echo "reason=pub_get_failed" >> "$GITHUB_OUTPUT"; exit 1; }
      - name: flutter analyze (errors and warnings are fatal, infos are not)
        id: analyze
        run: flutter analyze --no-fatal-infos || { echo "reason=analyze_failed" >> "$GITHUB_OUTPUT"; exit 1; }
      - name: Tests (quick release subset, or all with run_full_tests)
        id: tests
        env:
          RUN_FULL_TESTS: ${{ inputs.run_full_tests }}
        run: tool/release/run_tests.sh || { echo "reason=tests_failed" >> "$GITHUB_OUTPUT"; exit 1; }

  preflight-android:
    needs: [prepare, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Secrets (names only) and the upload keystore
        id: check
        env:
          HAS_PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 != '' }}
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          HAS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          HAS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS != '' }}
          HAS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
          HAS_BETA_TRACK: ${{ vars.ANDROID_BETA_TRACK != '' }}
          BETA_TRACK: ${{ vars.ANDROID_BETA_TRACK }}
          PLAY_STATUS: ${{ vars.PLAY_RELEASE_STATUS }}
          ANDROID_TRACK: ${{ inputs.android_track }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          fail() { echo "reason=$1" >> "$GITHUB_OUTPUT"; echo "::error::$2"; exit 1; }
          echo "ref: $GITHUB_REF  commit: $GITHUB_SHA"
          missing=()
          [ "$HAS_PLAY_JSON" = true ] || missing+=(GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64)
          [ "$HAS_KEYSTORE" = true ] || missing+=(ANDROID_KEYSTORE_BASE64)
          [ "$HAS_KEYSTORE_PASSWORD" = true ] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [ "$HAS_KEY_ALIAS" = true ] || missing+=(ANDROID_KEY_ALIAS)
          [ "$HAS_KEY_PASSWORD" = true ] || missing+=(ANDROID_KEY_PASSWORD)
          if [ "$ANDROID_TRACK" = beta ] && [ "$HAS_BETA_TRACK" != true ]; then
            missing+=("variable ANDROID_BETA_TRACK")
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            fail missing_secret "missing in repository secrets/variables (Settings → Secrets and variables → Actions): ${missing[*]}"
          fi
          case "$ANDROID_TRACK" in internal|beta) ;; *) fail track_not_allowed "track $ANDROID_TRACK is not allowed" ;; esac
          if echo "$BETA_TRACK" | grep -qi prod; then
            fail track_not_allowed "variable ANDROID_BETA_TRACK must not be a production track"
          fi
          case "${PLAY_STATUS:-completed}" in draft|completed) ;; *) fail track_not_allowed "PLAY_RELEASE_STATUS must be draft or completed" ;; esac
          keystore=$(mktemp)
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore" || fail keystore_invalid "ANDROID_KEYSTORE_BASE64 is not valid base64"
          keytool -list -keystore "$keystore" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" > /dev/null 2>&1 \
            || fail keystore_invalid "the keystore does not open with ANDROID_KEYSTORE_PASSWORD or has no alias ANDROID_KEY_ALIAS"
          echo "Upload keystore OK (alias present)"

  android:
    needs: [prepare, quality, preflight-android]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: mybrev-beta-release-android
      cancel-in-progress: false
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    outputs:
      version_code: ${{ steps.release.outputs.ANDROID_VERSION_CODE }}
      version: ${{ steps.release.outputs.ANDROID_VERSION }}
      track: ${{ steps.release.outputs.ANDROID_TRACK }}
      error_code: ${{ steps.classify.outputs.code }}
      error_text: ${{ steps.classify.outputs.text }}
      error_next: ${{ steps.classify.outputs.next }}
    steps:
      - uses: actions/checkout@v4
      - name: Building exactly the commit of this run
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ needs.prepare.outputs.flutter_version }}
          cache: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: fastlane android ${{ inputs.android_track }}
        id: release
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_BETA_TRACK: ${{ vars.ANDROID_BETA_TRACK }}
          PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          ANDROID_TRACK: ${{ inputs.android_track }}
        run: |
          set -euo pipefail
          case "$ANDROID_TRACK" in internal|beta) ;; *) echo "::error::track $ANDROID_TRACK is not allowed"; exit 1 ;; esac
          flutter --version | head -1
          bundle exec fastlane android "$ANDROID_TRACK" 2>&1 | tee "$RUNNER_TEMP/fastlane-android.log"
          cat fastlane/release-result-android.env >> "$GITHUB_OUTPUT"
      - name: Failure class
        id: classify
        if: failure() && steps.release.outcome == 'failure'
        run: |
          IFS='|' read -r code text next < <(tool/release/classify_failure.sh "$RUNNER_TEMP/fastlane-android.log")
          { echo "code=$code"; echo "text=$text"; echo "next=$next"; } >> "$GITHUB_OUTPUT"

  summary:
    needs: [prepare, quality, preflight-android, android]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Release summary
        env:
          SHA: ${{ github.sha }}
          PLATFORM: android
          ANDROID_TRACK_INPUT: ${{ inputs.android_track }}
          PUBSPEC_VERSION: ${{ needs.prepare.outputs.app_version }}
          PUBSPEC_BUILD: ${{ needs.prepare.outputs.app_build }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          PREPARE_REASON: ${{ needs.prepare.outputs.reason }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          QUALITY_REASON: ${{ needs.quality.outputs.reason }}
          ANDROID_PREFLIGHT_RESULT: ${{ needs.preflight-android.result }}
          ANDROID_PREFLIGHT_REASON: ${{ needs.preflight-android.outputs.reason }}
          ANDROID_RESULT: ${{ needs.android.result }}
          ANDROID_VERSION: ${{ needs.android.outputs.version }}
          ANDROID_VERSION_CODE: ${{ needs.android.outputs.version_code }}
          ANDROID_TRACK: ${{ needs.android.outputs.track }}
          ANDROID_ERROR_CODE: ${{ needs.android.outputs.error_code }}
          ANDROID_ERROR_TEXT: ${{ needs.android.outputs.error_text }}
          ANDROID_ERROR_NEXT: ${{ needs.android.outputs.error_next }}
          PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: tool/release/summary.sh >> "$GITHUB_STEP_SUMMARY"
